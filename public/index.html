<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FERROCABLES® - Recibo de Proveedores</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

  <header class="bg-white border-b shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-blue-600 p-2 rounded-lg text-white font-bold">⚡</div>
        <div>
          <h1 class="font-bold text-lg text-slate-900">FERROCABLES ®</h1>
          <p class="text-xs text-slate-500">Gestión Logística & Control de Recibo de Proveedores</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="abrirModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded-lg text-xs shadow">+ Programar Cita</button>
        <button onclick="alert('Dashboard activo')" class="bg-slate-200 hover:bg-slate-300 text-slate-800 font-semibold px-3 py-2 rounded-lg text-xs">📊 Dashboard</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full space-y-4">

    <div class="bg-white border rounded-lg p-4 shadow-sm flex items-center justify-between">
      <p class="text-xs text-slate-600">Franja de Recibo: <strong class="text-blue-700">07:00 AM – 04:00 PM</strong> | Máx. 3 Proveedores / Hora</p>
      <div class="space-x-1">
        <button onclick="cambiarSemana(-1)" class="border px-3 py-1 rounded text-xs bg-slate-50 hover:bg-slate-100">← Sem. Anterior</button>
        <button onclick="semanaActual()" class="bg-blue-600 text-white px-3 py-1 rounded text-xs font-semibold">Hoy</button>
        <button onclick="cambiarSemana(1)" class="border px-3 py-1 rounded text-xs bg-slate-50 hover:bg-slate-100">Sem. Siguiente →</button>
      </div>
    </div>

    <div class="bg-white border rounded-lg p-4 shadow-sm overflow-x-auto">
      <div class="min-w-[900px]">
        <div class="grid grid-cols-8 gap-2 mb-2 text-center text-xs font-bold bg-slate-900 text-white py-2 rounded">
          <div>Hora</div>
          <div id="head-lun">Lun 26/10</div>
          <div id="head-mar">Mar 27/10</div>
          <div id="head-mie">Mié 28/10</div>
          <div id="head-jue">Jue 29/10</div>
          <div id="head-vie">Vie 30/10</div>
          <div id="head-sab">Sáb 31/10</div>
          <div id="head-dom" class="text-rose-300">Dom 01/11</div>
        </div>
        <div id="calendarGrid" class="space-y-1"></div>
      </div>
    </div>

  </main>

  <div id="modalCita" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-lg p-6 shadow-xl max-w-md w-full space-y-4">
      <h3 class="font-bold text-slate-800">Programar Cita</h3>
      <form id="formCita" class="space-y-3">
        <input type="text" id="inputProveedor" required placeholder="Proveedor" class="w-full border p-2 text-sm rounded">
        <div class="grid grid-cols-2 gap-2">
          <input type="date" id="inputFecha" required class="border p-2 text-sm rounded">
          <select id="inputHora" required class="border p-2 text-sm rounded">
            <option value="07:00">07:00 AM</option>
            <option value="08:00">08:00 AM</option>
            <option value="09:00">09:00 AM</option>
            <option value="10:00">10:00 AM</option>
            <option value="11:00">11:00 AM</option>
            <option value="12:00">12:00 PM</option>
            <option value="13:00">01:00 PM</option>
            <option value="14:00">02:00 PM</option>
            <option value="15:00">03:00 PM</option>
            <option value="16:00">04:00 PM</option>
          </select>
        </div>
        <div class="flex justify-end space-x-2">
          <button type="button" onclick="cerrarModal()" class="px-3 py-1 border text-sm rounded">Cancelar</button>
          <button type="submit" class="px-3 py-1 bg-blue-600 text-white text-sm rounded">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let globalCitas = [];
    let fechaLunesBase = new Date(2026, 9, 26); // 26 Octubre 2026

    const horasTrabajo = ["07:00", "08:00", "09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00"];

    function formatDate(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function cambiarSemana(offset) {
      fechaLunesBase.setDate(fechaLunesBase.getDate() + (offset * 7));
      renderCalendar();
    }

    function semanaActual() {
      fechaLunesBase = new Date(2026, 9, 26);
      renderCalendar();
    }

    async function cargarCitas() {
      try {
        const res = await fetch('/api/citas');
        globalCitas = await res.json();
      } catch (err) {
        console.error("Error al obtener citas:", err);
      }
      renderCalendar();
    }

    function renderCalendar() {
      const diasSemana = [];
      for (let i = 0; i < 7; i++) {
        const temp = new Date(fechaLunesBase);
        temp.setDate(temp.getDate() + i);
        diasSemana.push(formatDate(temp));
      }

      const idsHeaders = ['head-lun', 'head-mar', 'head-mie', 'head-jue', 'head-vie', 'head-sab', 'head-dom'];
      const nombres = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];

      diasSemana.forEach((f, idx) => {
        const el = document.getElementById(idsHeaders[idx]);
        if (el) {
          const [, m, d] = f.split('-');
          el.innerText = `${nombres[idx]} ${d}/${m}`;
        }
      });

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = horasTrabajo.map(hora => {
        return `
          <div class="grid grid-cols-8 gap-1 text-xs min-h-[50px] border-b pb-1">
            <div class="flex items-center justify-center font-bold text-slate-500 bg-slate-50 rounded">${hora}</div>
            ${diasSemana.map((f, idxDia) => {
              if (idxDia === 6) return `<div class="bg-rose-50 text-rose-400 p-1 rounded text-center flex items-center justify-center italic">Descanso</div>`;
              
              const citas = globalCitas.filter(c => c.fecha === f && c.hora === hora);
              const libres = 3 - citas.length;

              return `
                <div class="bg-slate-50 border border-slate-200 rounded p-1 space-y-1">
                  ${citas.map(c => `
                    <div class="${c.estado === 'RECIBIDO' ? 'bg-emerald-100 border-emerald-300 text-emerald-900' : 'bg-amber-100 border-amber-300 text-amber-900'} border rounded p-1 shadow-sm">
                      <div class="font-bold flex justify-between items-center">
                        <span>${c.proveedor}</span>
                        <button onclick="eliminarCita('${c.id}')" class="text-red-500 font-normal">✕</button>
                      </div>
                      <select onchange="cambiarEstado('${c.id}', this.value)" class="text-[10px] mt-1 bg-white border rounded px-1 py-0.5">
                        <option value="CON CITA" ${c.estado === 'CON CITA' ? 'selected' : ''}>Con Cita</option>
                        <option value="RECIBIDO" ${c.estado === 'RECIBIDO' ? 'selected' : ''}>Recibido ✓</option>
                      </select>
                    </div>
                  `).join('')}
                  ${libres > 0 ? `<div onclick="abrirModalConParametros('${f}', '${hora}')" class="text-[10px] text-slate-400 border border-dashed border-slate-300 rounded p-1 text-center cursor-pointer hover:bg-slate-100">+ Libre (${libres})</div>` : ''}
                </div>
              `;
            }).join('')}
          </div>
        `;
      }).join('');
    }

    async function cambiarEstado(id, estado) {
      await fetch('/api/citas/estado', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, estado })
      });
      await cargarCitas();
    }

    async function eliminarCita(id) {
      if (confirm('¿Eliminar cita?')) {
        await fetch(`/api/citas/${id}`, { method: 'DELETE' });
        await cargarCitas();
      }
    }

    function abrirModal() { document.getElementById('modalCita').classList.remove('hidden'); }
    function abrirModalConParametros(f, h) {
      document.getElementById('inputFecha').value = f;
      document.getElementById('inputHora').value = h;
      abrirModal();
    }
    function cerrarModal() { document.getElementById('modalCita').classList.add('hidden'); }

    document.getElementById('formCita').addEventListener('submit', async (e) => {
      e.preventDefault();
      await fetch('/api/citas', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          proveedor: document.getElementById('inputProveedor').value,
          fecha: document.getElementById('inputFecha').value,
          hora: document.getElementById('inputHora').value
        })
      });
      cerrarModal();
      await cargarCitas();
    });

    document.addEventListener('DOMContentLoaded', cargarCitas);
  </script>
</body>
</html>
