<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FERROCABLES® - Recibo de Proveedores</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #020617; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <div class="bg-blue-600 p-2 rounded-xl text-white shadow-lg shadow-blue-500/20">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        </div>
        <div>
          <h1 class="font-bold text-lg tracking-wider text-white">FERROCABLES®</h1>
          <p class="text-xs text-slate-400">Gestión Logística & Control de Recibo de Proveedores</p>
        </div>
      </div>

      <div class="flex items-center space-x-3">
        <button onclick="abrirModal()" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-4 py-2 rounded-xl text-xs transition-all shadow-lg shadow-blue-600/20 flex items-center gap-1.5">
          <span>+</span> Programar Cita
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full space-y-6">

    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl flex flex-wrap items-center justify-between gap-4">
      <div>
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Franja de Recibo</p>
        <p class="text-sm font-bold text-white mt-0.5">07:00 AM – 04:00 PM <span class="text-xs text-slate-500 font-normal">| Máx. 3 Proveedores / Hora</span></p>
      </div>

      <div class="flex items-center space-x-2">
        <button onclick="cambiarSemana(-1)" class="bg-slate-950 border border-slate-800 hover:border-slate-700 px-3 py-1.5 rounded-xl text-xs text-slate-300 transition-all">← Sem. Anterior</button>
        <button onclick="semanaActual()" class="bg-blue-600 text-white px-3 py-1.5 rounded-xl text-xs font-semibold shadow-md">Hoy</button>
        <button onclick="cambiarSemana(1)" class="bg-slate-950 border border-slate-800 hover:border-slate-700 px-3 py-1.5 rounded-xl text-xs text-slate-300 transition-all">Sem. Siguiente →</button>
      </div>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl overflow-x-auto">
      <div class="min-w-[900px]">
        <div id="calendarHeader" class="grid grid-cols-8 gap-2 mb-3 text-center text-xs font-bold uppercase tracking-wider text-slate-400 border-b border-slate-800 pb-3">
          <div class="p-2 text-slate-500">Hora</div>
          <div class="p-2 bg-slate-950 rounded-xl border border-slate-800/80 text-slate-200" id="head-lun">Lun</div>
          <div class="p-2 bg-slate-950 rounded-xl border border-slate-800/80 text-slate-200" id="head-mar">Mar</div>
          <div class="p-2 bg-slate-950 rounded-xl border border-slate-800/80 text-slate-200" id="head-mie">Mié</div>
          <div class="p-2 bg-slate-950 rounded-xl border border-slate-800/80 text-slate-200" id="head-jue">Jue</div>
          <div class="p-2 bg-slate-950 rounded-xl border border-slate-800/80 text-slate-200" id="head-vie">Vie</div>
          <div class="p-2 bg-slate-950 rounded-xl border border-slate-800/80 text-slate-200" id="head-sab">Sáb</div>
          <div class="p-2 bg-rose-500/10 rounded-xl border border-rose-500/20 text-rose-400" id="head-dom">Dom</div>
        </div>

        <div id="calendarGrid" class="space-y-2"></div>
      </div>
    </div>

  </main>

  <div id="modalCita" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl max-w-md w-full space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="text-sm font-bold text-white uppercase tracking-wider">Programar Recibo de Proveedor</h3>
        <button onclick="cerrarModal()" class="text-slate-400 hover:text-white text-lg">✕</button>
      </div>

      <form id="formCita" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Proveedor</label>
          <input type="text" id="inputProveedor" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-blue-500" placeholder="Ej: PROCABLES / DICO">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Fecha</label>
            <input type="date" id="inputFecha" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Hora</label>
            <select id="inputHora" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
              <option value="07:00">07:00 AM</option>
              <option value="08:00">08:00 AM</option>
              <option value="09:00">09:00 AM</option>
              <option value="10:00">10:00 AM</option>
              <option value="11:00">11:00 AM</option>
              <option value="12:00">12:00 PM</option>
              <option value="13:00">01:00 PM</option>
              <option value="14:00">02:00 PM</option>
              <option value="15:00">03:00 PM</option>
              <option value="16:00">04:00 PM</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Material / Placa</label>
          <input type="text" id="inputMaterial" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-blue-500" placeholder="Ej: Rollo de Cable / Placa AAA-123">
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-xl text-sm transition-all shadow-lg shadow-blue-600/20">
          Guardar Cita en Cronograma
        </button>
      </form>
    </div>
  </div>

  <script>
    let globalCitas = [];
    let fechaReferencia = new Date();

    const horasTrabajo = ["07:00", "08:00", "09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00"];

    function getStartOfWeek(d) {
      const date = new Date(d);
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(date.setDate(diff));
    }

    function cambiarSemana(dias) {
      fechaReferencia.setDate(fechaReferencia.getDate() + (dias * 7));
      renderCalendar();
    }

    function semanaActual() {
      fechaReferencia = new Date();
      renderCalendar();
    }

    async function cargarCitas() {
      try {
        const res = await fetch('/api/citas');
        globalCitas = await res.json();
        renderCalendar();
      } catch (err) {
        console.error("Error al cargar citas:", err);
      }
    }

    function renderCalendar() {
      const startOfWeek = getStartOfWeek(fechaReferencia);
      const diasSemana = [];

      for (let i = 0; i < 7; i++) {
        const temp = new Date(startOfWeek);
        temp.setDate(temp.getDate() + i);
        diasSemana.push(temp.toISOString().split('T')[0]);
      }

      const diasNombres = ['head-lun', 'head-mar', 'head-mie', 'head-jue', 'head-vie', 'head-sab', 'head-dom'];
      const nombresLegibles = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];

      diasSemana.forEach((fechaStr, idx) => {
        const el = document.getElementById(diasNombres[idx]);
        if (el) {
          const [, m, d] = fechaStr.split('-');
          el.innerText = `${nombresLegibles[idx]} ${d}/${m}`;
        }
      });

      const grid = document.getElementById('calendarGrid');
      if (!grid) return;

      grid.innerHTML = horasTrabajo.map(hora => {
        return `
          <div class="grid grid-cols-8 gap-2 items-stretch min-h-[70px]">
            <div class="flex items-center justify-center font-mono text-xs font-semibold text-slate-400 bg-slate-950 rounded-xl border border-slate-800/50 p-2">
              ${hora}
            </div>

            ${diasSemana.map((fechaStr, idxDia) => {
              const esDomingo = idxDia === 6;
              const citasCoincidentes = globalCitas.filter(c => c.fecha === fechaStr && c.hora === hora);
              const cuposLibres = 3 - citasCoincidentes.length;

              if (esDomingo) {
                return `<div class="bg-rose-950/20 border border-rose-900/30 rounded-xl p-2 flex items-center justify-center text-[11px] font-semibold text-rose-500/70 italic">Descanso</div>`;
              }

              return `
                <div class="bg-slate-950/80 border border-slate-800/80 rounded-xl p-2 flex flex-col justify-between space-y-1 hover:border-slate-700 transition-all">
                  ${citasCoincidentes.map(c => `
                    <div class="bg-slate-900 border border-slate-700 rounded-lg p-2 shadow-md relative group">
                      <div class="flex justify-between items-start">
                        <span class="font-bold text-xs text-white truncate max-w-[100px]">${c.proveedor}</span>
                        <button onclick="eliminarCita('${c.id}')" class="text-[10px] text-red-400 hover:text-red-300">✕</button>
                      </div>
                      ${c.tipoMaterial ? `<p class="text-[10px] text-slate-400 truncate mt-0.5">${c.tipoMaterial}</p>` : ''}
                      
                      <div class="mt-1.5 flex items-center justify-between">
                        <select onchange="cambiarEstado('${c.id}', this.value)" class="bg-slate-950 border border-slate-800 text-[10px] rounded px-1 py-0.5 font-semibold text-amber-400 focus:outline-none">
                          <option value="CON CITA" ${c.estado === 'CON CITA' ? 'selected' : ''}>Con Cita</option>
                          <option value="RECIBIDO" ${c.estado === 'RECIBIDO' ? 'selected' : ''}>Recibido ✓</option>
                          <option value="EN PROCESO" ${c.estado === 'EN PROCESO' ? 'selected' : ''}>En Proceso</option>
                        </select>
                      </div>
                    </div>
                  `).join('')}

                  ${cuposLibres > 0 ? `
                    <div onclick="abrirModalConParametros('${fechaStr}', '${hora}')" class="border border-dashed border-slate-800 hover:border-blue-500/50 rounded-lg p-1.5 text-center text-[10px] text-slate-500 hover:text-blue-400 cursor-pointer transition-all flex items-center justify-center gap-1">
                      <span>+ Libre (${cuposLibres})</span>
                    </div>
                  ` : ''}
                </div>
              `;
            }).join('')}
          </div>
        `;
      }).join('');
    }

    async function cambiarEstado(id, nuevoEstado) {
      await fetch('/api/citas/estado', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, estado: nuevoEstado })
      });
      await cargarCitas();
    }

    async function eliminarCita(id) {
      if (confirm('¿Deseas eliminar esta cita del cronograma?')) {
        await fetch(`/api/citas/${id}`, { method: 'DELETE' });
        await cargarCitas();
      }
    }

    function abrirModal() {
      document.getElementById('modalCita').classList.remove('hidden');
    }

    function abrirModalConParametros(fecha, hora) {
      document.getElementById('inputFecha').value = fecha;
      document.getElementById('inputHora').value = hora;
      abrirModal();
    }

    function cerrarModal() {
      document.getElementById('modalCita').classList.add('hidden');
    }

    document.getElementById('formCita').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = {
        proveedor: document.getElementById('inputProveedor').value.trim(),
        fecha: document.getElementById('inputFecha').value,
        hora: document.getElementById('inputHora').value,
        tipoMaterial: document.getElementById('inputMaterial').value.trim()
      };

      const res = await fetch('/api/citas', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      if (res.ok) {
        document.getElementById('inputProveedor').value = '';
        document.getElementById('inputMaterial').value = '';
        cerrarModal();
        await cargarCitas();
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('inputFecha').value = today;
      cargarCitas();
    });
  </script>
</body>
</html>
