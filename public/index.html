<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FERROCABLES® - Recibo de Proveedores</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col">

  <header class="bg-white border-b shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-blue-600 p-2 rounded-lg text-white font-bold">⚡</div>
        <div>
          <h1 class="font-bold text-lg text-gray-900">FERROCABLES ®</h1>
          <p class="text-xs text-gray-500">Gestión Logística & Control de Recibo de Proveedores</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="abrirModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded-lg text-xs shadow">+ Programar Cita</button>
        <button onclick="alert('Dashboard activo')" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold px-3 py-2 rounded-lg text-xs">📊 Dashboard</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full space-y-4">

    <div class="bg-white border rounded-lg p-4 shadow-sm flex items-center justify-between">
      <p class="text-xs text-gray-600">Franja de Recibo: <strong class="text-blue-700">07:00 AM – 04:00 PM</strong> | Máx. 3 Proveedores / Hora</p>
      <div class="space-x-1">
        <button onclick="cambiarSemana(-1)" class="border px-3 py-1 rounded text-xs bg-gray-50 hover:bg-gray-100">← Sem. Anterior</button>
        <button onclick="semanaActual()" class="bg-blue-600 text-white px-3 py-1 rounded text-xs font-semibold">Hoy</button>
        <button onclick="cambiarSemana(1)" class="border px-3 py-1 rounded text-xs bg-gray-50 hover:bg-gray-100">Sem. Siguiente →</button>
      </div>
    </div>

    <div class="bg-white border rounded-lg p-4 shadow-sm overflow-x-auto">
      <div class="min-w-[900px]">
        <div class="grid grid-cols-8 gap-2 mb-2 text-center text-xs font-bold bg-slate-900 text-white py-2 rounded">
          <div>Hora</div>
          <div id="head-lun">Lun</div>
          <div id="head-mar">Mar</div>
          <div id="head-mie">Mié</div>
          <div id="head-jue">Jue</div>
          <div id="head-vie">Vie</div>
          <div id="head-sab">Sáb</div>
          <div id="head-dom" class="text-rose-300">Dom</div>
        </div>
        <div id="calendarGrid" class="space-y-1"></div>
      </div>
    </div>

  </main>

  <div id="modalCita" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-lg p-6 shadow-xl max-w-md w-full space-y-4">
      <h3 class="font-bold text-gray-800">Programar Recibo de Proveedor</h3>
      <form id="formCita" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Proveedor</label>
          <input type="text" id="inputProveedor" required placeholder="Ej: PROCABLES" class="w-full border p-2 text-sm rounded">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Fecha</label>
            <input type="date" id="inputFecha" required class="w-full border p-2 text-sm rounded">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Hora</label>
            <select id="inputHora" required class="w-full border p-2 text-sm rounded">
              <option value="07:00">07:00 AM</option>
              <option value="08:00">08:00 AM</option>
              <option value="09:00">09:00 AM</option>
              <option value="10:00">10:00 AM</option>
              <option value="11:00">11:00 AM</option>
              <option value="12:00">12:00 PM</option>
              <option value="13:00">01:00 PM</option>
              <option value="14:00">02:00 PM</option>
              <option value="15:00">03:00 PM</option>
              <option value="16:00">04:00 PM</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Tipo de Ingreso</label>
          <select id="inputEstado" required class="w-full border p-2 text-sm rounded bg-gray-50">
            <option value="CON CITA">Con Cita (Programado)</option>
            <option value="SIN CITA">Sin Cita (Llegó sin agendar)</option>
            <option value="RECIBIDO">Recibido (Completado)</option>
          </select>
        </div>

        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" onclick="cerrarModal()" class="px-3 py-1.5 border text-sm rounded">Cancelar</button>
          <button type="submit" class="px-4 py-1.5 bg-blue-600 text-white font-semibold text-sm rounded shadow">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const citasPrecargadas = [
      {"id": "h1", "fecha": "2026-10-19", "hora": "07:00", "proveedor": "PROCABLES", "estado": "RECIBIDO"},
      {"id": "h2", "fecha": "2026-10-20", "hora": "07:00", "proveedor": "DICO", "estado": "RECIBIDO"},
      {"id": "h3", "fecha": "2026-10-20", "hora": "07:00", "proveedor": "JAGUARCOL", "estado": "RECIBIDO"},
      {"id": "h4", "fecha": "2026-10-21", "hora": "07:00", "proveedor": "DICO", "estado": "RECIBIDO"},
      {"id": "1", "fecha": "2026-10-26", "hora": "07:00", "proveedor": "MERCURY", "estado": "RECIBIDO"},
      {"id": "2", "fecha": "2026-10-26", "hora": "10:00", "proveedor": "ELECTRICOS PEREZ", "estado": "RECIBIDO"},
      {"id": "3", "fecha": "2026-10-26", "hora": "12:00", "proveedor": "LAUMAYER", "estado": "RECIBIDO"},
      {"id": "4", "fecha": "2026-10-26", "hora": "14:00", "proveedor": "PROCABLES", "estado": "RECIBIDO"},
      {"id": "5", "fecha": "2026-10-26", "hora": "14:00", "proveedor": "TCC", "estado": "RECIBIDO"},
      {"id": "6", "fecha": "2026-10-27", "hora": "07:00", "proveedor": "COMERCIAL ELECTRICOS", "estado": "RECIBIDO"},
      {"id": "7", "fecha": "2026-10-27", "hora": "10:00", "proveedor": "INSUTUBOS", "estado": "RECIBIDO"},
      {"id": "8", "fecha": "2026-10-27", "hora": "13:00", "proveedor": "GALCO", "estado": "RECIBIDO"},
      {"id": "9", "fecha": "2026-10-27", "hora": "13:00", "proveedor": "JAGUARCOL", "estado": "RECIBIDO"},
      {"id": "10", "fecha": "2026-10-27", "hora": "14:00", "proveedor": "MUNDIAL DE TORNILLOS", "estado": "RECIBIDO"},
      {"id": "11", "fecha": "2026-10-28", "hora": "09:00", "proveedor": "PROCABLES", "estado": "RECIBIDO"},
      {"id": "12", "fecha": "2026-10-28", "hora": "10:00", "proveedor": "JG DIST", "estado": "RECIBIDO"},
      {"id": "13", "fecha": "2026-10-28", "hora": "11:00", "proveedor": "INSUTUBOS", "estado": "RECIBIDO"},
      {"id": "14", "fecha": "2026-10-28", "hora": "13:00", "proveedor": "SOMELECT", "estado": "RECIBIDO"},
      {"id": "15", "fecha": "2026-10-28", "hora": "13:00", "proveedor": "GALCO", "estado": "RECIBIDO"},
      {"id": "16", "fecha": "2026-10-28", "hora": "14:00", "proveedor": "TCC", "estado": "RECIBIDO"},
      {"id": "17", "fecha": "2026-10-28", "hora": "14:00", "proveedor": "COORDINADORA", "estado": "RECIBIDO"},
      {"id": "18", "fecha": "2026-10-28", "hora": "16:00", "proveedor": "ENSAMBLES Y DISTRIBUCIONES", "estado": "RECIBIDO"},
      {"id": "19", "fecha": "2026-10-29", "hora": "07:00", "proveedor": "EDEMCO", "estado": "RECIBIDO"},
      {"id": "20", "fecha": "2026-10-29", "hora": "08:00", "proveedor": "EQUIELECT", "estado": "RECIBIDO"},
      {"id": "21", "fecha": "2026-10-29", "hora": "10:00", "proveedor": "TECNOSA", "estado": "RECIBIDO"},
      {"id": "22", "fecha": "2026-10-29", "hora": "10:00", "proveedor": "PROCABLES", "estado": "RECIBIDO"},
      {"id": "23", "fecha": "2026-10-29", "hora": "11:00", "proveedor": "CILES", "estado": "RECIBIDO"},
      {"id": "24", "fecha": "2026-10-29", "hora": "13:00", "proveedor": "ALDIA", "estado": "RECIBIDO"},
      {"id": "25", "fecha": "2026-10-29", "hora": "13:00", "proveedor": "DICO", "estado": "RECIBIDO"},
      {"id": "26", "fecha": "2026-10-29", "hora": "14:00", "proveedor": "TCC", "estado": "RECIBIDO"},
      {"id": "27", "fecha": "2026-10-29", "hora": "14:00", "proveedor": "TERCOL", "estado": "RECIBIDO"},
      {"id": "28", "fecha": "2026-10-29", "hora": "14:00", "proveedor": "ENSAMBLES Y DISEÑOS", "estado": "RECIBIDO"},
      {"id": "29", "fecha": "2026-10-29", "hora": "15:00", "proveedor": "GALCO", "estado": "RECIBIDO"},
      {"id": "30", "fecha": "2026-10-30", "hora": "08:00", "proveedor": "PROCABLES", "estado": "CON CITA"},
      {"id": "31", "fecha": "2026-10-30", "hora": "10:00", "proveedor": "GALCO", "estado": "CON CITA"},
      {"id": "32", "fecha": "2026-10-30", "hora": "11:00", "proveedor": "PROCABLES", "estado": "CON CITA"},
      {"id": "33", "fecha": "2026-10-30", "hora": "13:00", "proveedor": "TECNOSA", "estado": "CON CITA"},
      {"id": "34", "fecha": "2026-10-30", "hora": "14:00", "proveedor": "TCC", "estado": "CON CITA"}
    ];

    let globalCitas = [...citasPrecargadas];
    let offsetSemana = 0;

    const fechasSemanaActual = ["2026-10-26", "2026-10-27", "2026-10-28", "2026-10-29", "2026-10-30", "2026-10-31", "2026-11-01"];
    const fechasSemanaAnterior = ["2026-10-19", "2026-10-20", "2026-10-21", "2026-10-22", "2026-10-23", "2026-10-24", "2026-10-25"];
    const horasTrabajo = ["07:00", "08:00", "09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00"];

    function cambiarSemana(dir) {
      offsetSemana += dir;
      renderCalendar();
    }

    function semanaActual() {
      offsetSemana = 0;
      renderCalendar();
    }

    async function cargarCitas() {
      try {
        const res = await fetch('/api/citas');
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0) {
          globalCitas = data;
        }
      } catch (err) {}
      renderCalendar();
    }

    function renderCalendar() {
      const diasSemana = offsetSemana === -1 ? fechasSemanaAnterior : fechasSemanaActual;

      const idsHeaders = ['head-lun', 'head-mar', 'head-mie', 'head-jue', 'head-vie', 'head-sab', 'head-dom'];
      const nombres = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];

      diasSemana.forEach((f, idx) => {
        const el = document.getElementById(idsHeaders[idx]);
        if (el) {
          const parts = f.split('-');
          el.innerText = `${nombres[idx]} ${parts[2]}/${parts[1]}`;
        }
      });

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = horasTrabajo.map(hora => {
        return `
          <div class="grid grid-cols-8 gap-1 text-xs min-h-[50px] border-b pb-1">
            <div class="flex items-center justify-center font-bold text-gray-500 bg-gray-50 rounded">${hora}</div>
            ${diasSemana.map((f, idxDia) => {
              if (idxDia === 6) return `<div class="bg-rose-50 text-rose-400 p-1 rounded text-center flex items-center justify-center italic">Descanso</div>`;
              
              const citas = globalCitas.filter(c => c.fecha === f && c.hora === hora);
              const libres = 3 - citas.length;

              return `
                <div class="bg-slate-50 border border-slate-200 rounded p-1 space-y-1">
                  ${citas.map(c => {
                    let colorEstilo = 'bg-amber-100 border-amber-300 text-amber-900';
                    if (c.estado === 'RECIBIDO') colorEstilo = 'bg-emerald-100 border-emerald-300 text-emerald-900';
                    if (c.estado === 'SIN CITA') colorEstilo = 'bg-purple-100 border-purple-300 text-purple-900';

                    return `
                      <div class="${colorEstilo} border rounded p-1 shadow-sm">
                        <div class="font-bold flex justify-between items-center">
                          <span>${c.proveedor}</span>
                          <button onclick="eliminarCita('${c.id}')" class="text-red-500 font-normal">✕</button>
                        </div>
                        <select onchange="cambiarEstado('${c.id}', this.value)" class="text-[10px] mt-1 bg-white border rounded px-1 py-0.5">
                          <option value="CON CITA" ${c.estado === 'CON CITA' ? 'selected' : ''}>Con Cita</option>
                          <option value="SIN CITA" ${c.estado === 'SIN CITA' ? 'selected' : ''}>Sin Cita</option>
                          <option value="RECIBIDO" ${c.estado === 'RECIBIDO' ? 'selected' : ''}>Recibido ✓</option>
                        </select>
                      </div>
                    `;
                  }).join('')}
                  ${libres > 0 ? `<div onclick="abrirModalConParametros('${f}', '${hora}')" class="text-[10px] text-gray-400 border border-dashed border-gray-300 rounded p-1 text-center cursor-pointer hover:bg-gray-100">+ Libre (${libres})</div>` : ''}
                </div>
              `;
            }).join('')}
          </div>
        `;
      }).join('');
    }

    async function cambiarEstado(id, estado) {
      const item = globalCitas.find(c => c.id === id);
      if (item) item.estado = estado;
      renderCalendar();
      await fetch('/api/citas/estado', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, estado })
      });
    }

    async function eliminarCita(id) {
      if (confirm('¿Eliminar cita?')) {
        globalCitas = globalCitas.filter(c => c.id !== id);
        renderCalendar();
        await fetch(`/api/citas/${id}`, { method: 'DELETE' });
      }
    }

    function abrirModal() { document.getElementById('modalCita').classList.remove('hidden'); }
    function abrirModalConParametros(f, h) {
      document.getElementById('inputFecha').value = f;
      document.getElementById('inputHora').value = h;
      abrirModal();
    }
    function cerrarModal() { document.getElementById('modalCita').classList.add('hidden'); }

    document.getElementById('formCita').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nueva = {
        id: Date.now().toString(),
        proveedor: document.getElementById('inputProveedor').value,
        fecha: document.getElementById('inputFecha').value,
        hora: document.getElementById('inputHora').value,
        estado: document.getElementById('inputEstado').value
      };
      globalCitas.push(nueva);
      renderCalendar();
      cerrarModal();

      await fetch('/api/citas', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(nueva)
      });
    });

    document.addEventListener('DOMContentLoaded', () => {
      renderCalendar();
      cargarCitas();
    });
  </script>
</body>
</html>
