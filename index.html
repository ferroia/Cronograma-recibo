<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cronograma de Recibo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 font-sans">
  <div class="max-w-6xl mx-auto space-y-4">
    <!-- Encabezado con Botones -->
    <div class="flex flex-wrap items-center justify-between bg-white p-4 rounded-xl shadow-sm gap-2">
      <h1 class="text-xl font-bold flex items-center gap-2">
        📅 Cronograma de Recibo
      </h1>
      <div class="flex gap-2">
        <button onclick="mostrarModal()" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-sm font-semibold hover:bg-blue-700">+ Programar</button>
        <button onclick="verVista('cronograma')" class="bg-blue-500 text-white px-3 py-1.5 rounded-lg text-sm font-semibold">🗓️ Cronograma</button>
        <button onclick="verVista('dashboard')" class="bg-gray-100 text-gray-700 px-3 py-1.5 rounded-lg text-sm font-semibold hover:bg-gray-200">📊 Dashboard</button>
      </div>
    </div>

    <!-- Vista Cronograma (Tabla de Horarios) -->
    <div id="vista-cronograma" class="bg-white p-4 rounded-xl shadow-sm overflow-x-auto">
      <div id="grid-cronograma" class="min-w-[700px]">
        <p class="text-gray-500 text-center py-8">Cargando programaciones...</p>
      </div>
    </div>

    <!-- Vista Dashboard (Métricas) -->
    <div id="vista-dashboard" class="hidden bg-white p-6 rounded-xl shadow-sm space-y-4">
      <h2 class="text-lg font-bold text-gray-800">Medición de Proveedores</h2>
      <div class="grid grid-cols-2 gap-4">
        <div class="bg-blue-50 p-4 rounded-lg border border-blue-100">
          <p class="text-xs text-blue-600 font-bold uppercase">Total Agendamientos</p>
          <p id="total-agendamientos" class="text-2xl font-black text-blue-900">0</p>
        </div>
        <div class="bg-emerald-50 p-4 rounded-lg border border-emerald-100">
          <p class="text-xs text-emerald-600 font-bold uppercase">Proveedores Únicos</p>
          <p id="total-proveedores" class="text-2xl font-black text-emerald-900">0</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Nuevo Agendamiento -->
  <div id="modal-programar" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl p-6 w-full max-w-md space-y-4 shadow-xl">
      <h3 class="font-bold text-lg">Programar Recibo de Proveedor</h3>
      <form id="form-programar" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-600">Obra / Destino</label>
          <input type="text" id="inp-obra" required class="w-full border rounded-lg p-2 text-sm mt-1" placeholder="Ej: Obra Central">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600">Nombre del Proveedor</label>
          <input type="text" id="inp-proveedor" required class="w-full border rounded-lg p-2 text-sm mt-1" placeholder="Ej: GALCO">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600">Fecha</label>
          <input type="date" id="inp-fecha" required class="w-full border rounded-lg p-2 text-sm mt-1">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-gray-600">Hora Inicio</label>
            <input type="time" id="inp-inicio" required class="w-full border rounded-lg p-2 text-sm mt-1">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600">Hora Fin</label>
            <input type="time" id="inp-fin" required class="w-full border rounded-lg p-2 text-sm mt-1">
          </div>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="cerrarModal()" class="px-4 py-2 text-sm text-gray-600">Cancelar</button>
          <button type="submit" class="px-4 py-2 text-sm bg-blue-600 text-white font-semibold rounded-lg">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    async function cargarDatos() {
      const res = await fetch('/api/v1/dashboard');
      const data = await res.json();
      
      document.getElementById('total-agendamientos').textContent = data.totalRegistros;
      document.getElementById('total-proveedores').textContent = data.proveedoresUnicos;
      
      renderCronograma(data.programaciones);
    }

    function renderCronograma(lista) {
      const container = document.getElementById('grid-cronograma');
      if (!lista.length) {
        container.innerHTML = '<p class="text-center text-gray-400 py-8">No hay recepciones agendadas.</p>';
        return;
      }
      
      let html = '<div class="space-y-2">';
      lista.forEach(item => {
        html += `
          <div class="flex items-center justify-between p-3 bg-blue-50/50 border border-blue-100 rounded-lg">
            <div>
              <span class="font-bold text-blue-900">${item.proveedor}</span>
              <span class="text-xs bg-blue-200 text-blue-800 px-2 py-0.5 rounded ml-2">${item.obra}</span>
              <p class="text-xs text-gray-500">${item.fecha} (${item.horaInicio} - ${item.horaFin})</p>
            </div>
            <span class="text-xs font-semibold text-emerald-600 bg-emerald-100 px-2.5 py-1 rounded-full">${item.estado}</span>
          </div>
        `;
      });
      html += '</div>';
      container.innerHTML = html;
    }

    function verVista(vista) {
      document.getElementById('vista-cronograma').classList.toggle('hidden', vista !== 'cronograma');
      document.getElementById('vista-dashboard').classList.toggle('hidden', vista !== 'dashboard');
    }

    function mostrarModal() { document.getElementById('modal-programar').classList.remove('hidden'); }
    function cerrarModal() { document.getElementById('modal-programar').classList.add('hidden'); }

    document.getElementById('form-programar').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        obra: document.getElementById('inp-obra').value,
        proveedor: document.getElementById('inp-proveedor').value,
        fecha: document.getElementById('inp-fecha').value,
        horaInicio: document.getElementById('inp-inicio').value,
        horaFin: document.getElementById('inp-fin').value
      };

      await fetch('/api/v1/programaciones', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      cerrarModal();
      e.target.reset();
      cargarDatos();
    });

    cargarDatos();
  </script>
</body>
</html>
